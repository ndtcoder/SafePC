name: SafePC CI (Sprint 0)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required docs exist
        run: |
          test -f README.md
          test -f docs/01-PRD.md
          test -f docs/02-ARCHITECTURE.md
          test -f docs/03-SECURITY.md
          test -f docs/04-ROADMAP.md
          echo "Docs OK"
      - name: Check no secrets in tracked files (basic)
        run: |
          # --exclude=ci.yml: mau grep se tu khop voi chinh dong lenh nay neu khong loai tru.
          ! grep -rInE "supabase.*service_role|BEGIN (RSA |OPENSSH )?PRIVATE KEY|sk-live|ghp_[A-Za-z0-9]{20,}" --exclude-dir=.git --exclude=ci.yml . || (echo "Possible secret found" && exit 1)
          echo "Secret scan OK"

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check dashboard project exists
        id: check
        run: |
          if [ -f apps/dashboard-web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard chua co package.json - bo qua build."
          fi
      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install and build dashboard
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/dashboard-web
        run: |
          npm ci
          npm run build

  build-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check agent solution exists
        id: check
        shell: pwsh
        run: |
          if (Test-Path 'apps/pc-agent/SafePC.Agent.sln') {
            'exists=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'exists=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Chua co file .sln - bo qua build agent.'
          }
      - name: Setup .NET 8 SDK
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build agent
        if: steps.check.outputs.exists == 'true'
        run: |
          dotnet restore apps/pc-agent/SafePC.Agent.sln
          dotnet build apps/pc-agent/SafePC.Agent.sln -c Release --no-restore
      - name: Publish agent (self-contained win-x64)
        if: steps.check.outputs.exists == 'true'
        run: |
          dotnet publish apps/pc-agent/src/SafePC.Agent.Service/SafePC.Agent.Service.csproj -c Release -r win-x64 --self-contained true -o apps/pc-agent/publish/Service
          dotnet publish apps/pc-agent/src/SafePC.Agent.Tray/SafePC.Agent.Tray.csproj -c Release -r win-x64 --self-contained true -o apps/pc-agent/publish/Tray
      - name: List Tray publish contents (diagnostic)
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          Get-ChildItem apps/pc-agent/publish/Tray -File | Select-Object -ExpandProperty Name | Sort-Object
          if (Test-Path apps/pc-agent/publish/Tray/UIAutomationTypes.dll) { Write-Host 'UIAutomationTypes.dll: PRESENT' } else { Write-Host 'UIAutomationTypes.dll: MISSING' }
      - name: Install Inno Setup
        if: steps.check.outputs.exists == 'true'
        run: choco install innosetup -y --no-progress
      - name: Build installer
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = 'ISCC.exe' }
          & $iscc apps/pc-agent/installer/SafePCAgent.iss
      - name: Upload installer artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: SafePCAgentSetup
          path: apps/pc-agent/installer-output/SafePCAgentSetup-*.exe
          if-no-files-found: error
