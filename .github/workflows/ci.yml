name: SafePC CI (Sprint 0)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    # Job nhe (ubuntu, vai giay): xac dinh lan day nay co cham code agent
    # khong. Chi khi co thi job Windows moi chay — day Dashboard/docs thi
    # run xong trong ~30 giay thay vi cho may Windows.
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect agent changes
        id: filter
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          head="${{ github.sha }}"
          # Mac dinh: CO thay doi (chay build). Chi khi diff thanh cong va
          # khong file agent nao doi thi moi bo qua — loi o bat ky buoc nao
          # cung dan toi chay build, khong bao gio bo qua am tham.
          agent=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # --no-renames: file doi ten RA KHOI apps/pc-agent/ van phai
            # tinh la thay doi (mac dinh diff chi in ten moi). Lay output
            # diff truoc: neu diff loi thi giu agent=true, khong bao gio
            # suy ra "khong doi" tu mot lenh loi.
            if changed=$(git diff --no-renames --name-only "$base" "$head" 2>/dev/null); then
              if ! printf '%s\n' "$changed" | grep -qE '^(apps/pc-agent/|\.github/workflows/ci\.yml$)'; then
                agent=false
              fi
            fi
          fi
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "Agent changed: $agent"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required docs exist
        run: |
          test -f README.md
          test -f docs/01-PRD.md
          test -f docs/02-ARCHITECTURE.md
          test -f docs/03-SECURITY.md
          test -f docs/04-ROADMAP.md
          echo "Docs OK"
      - name: Check no secrets in tracked files (basic)
        run: |
          # --exclude=ci.yml: mau grep se tu khop voi chinh dong lenh nay neu khong loai tru.
          ! grep -rInE "supabase.*service_role|BEGIN (RSA |OPENSSH )?PRIVATE KEY|sk-live|ghp_[A-Za-z0-9]{20,}" --exclude-dir=.git --exclude=ci.yml . || (echo "Possible secret found" && exit 1)
          echo "Secret scan OK"

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check dashboard project exists
        id: check
        run: |
          if [ -f apps/dashboard-web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard chua co package.json - bo qua build."
          fi
      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install and build dashboard
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/dashboard-web
        run: |
          npm ci
          npm run build

  build-agent:
    # Chi chay khi code agent (hoac chinh workflow nay) doi; neu job
    # changes loi thi van chay (fail-safe) de khong bao gio mat ban cai
    # chi vi bo loc thay doi gap van de.
    needs: changes
    # !cancelled(): GitHub tu them success() vao dieu kien job neu khong co
    # status function — khong co !cancelled() thi job changes do se lam
    # build-agent bi skip, dung truong hop fail-safe nay can tranh.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check agent solution exists
        id: check
        shell: pwsh
        run: |
          if (Test-Path 'apps/pc-agent/SafePC.Agent.sln') {
            'exists=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'exists=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Chua co file .sln - bo qua build agent.'
          }
      - name: Setup .NET 8 SDK
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
          # Cache goi NuGet: lan day sau co doi code agent thi restore
          # khong phai tai lai cac goi (repo khong co packages.lock.json
          # nen khoa cache theo file csproj).
          cache: true
          cache-dependency-path: 'apps/pc-agent/**/*.csproj'
      - name: Restore and build agent
        if: steps.check.outputs.exists == 'true'
        run: |
          dotnet restore apps/pc-agent/SafePC.Agent.sln
          dotnet build apps/pc-agent/SafePC.Agent.sln -c Release --no-restore
      - name: Publish agent (self-contained win-x64)
        if: steps.check.outputs.exists == 'true'
        run: |
          dotnet publish apps/pc-agent/src/SafePC.Agent.Service/SafePC.Agent.Service.csproj -c Release -r win-x64 --self-contained true -p:Version=0.1.${{ github.run_number }} -o apps/pc-agent/publish/Service
          dotnet publish apps/pc-agent/src/SafePC.Agent.Tray/SafePC.Agent.Tray.csproj -c Release -r win-x64 --self-contained true -p:Version=0.1.${{ github.run_number }} -o apps/pc-agent/publish/Tray
          dotnet publish apps/pc-agent/src/SafePC.Agent.NativeHost/SafePC.Agent.NativeHost.csproj -c Release -r win-x64 --self-contained true -p:Version=0.1.${{ github.run_number }} -o apps/pc-agent/publish/NativeHost
      - name: Check publish contents (diagnostic)
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          Get-ChildItem apps/pc-agent/publish/Tray -File | Select-Object -ExpandProperty Name | Sort-Object
          if (Test-Path apps/pc-agent/publish/Tray/UIAutomationTypes.dll) { Write-Host 'UIAutomationTypes.dll: PRESENT' } else { Write-Host 'UIAutomationTypes.dll: MISSING' }
          if (Test-Path apps/pc-agent/publish/Service/appsettings.json) { Write-Host 'Service appsettings.json: PRESENT' } else { throw 'Service appsettings.json: MISSING - sync config would not ship' }
          if (Test-Path apps/pc-agent/publish/NativeHost/SafePC.Agent.NativeHost.exe) { Write-Host 'NativeHost exe: PRESENT' } else { throw 'NativeHost exe: MISSING - extension native messaging would not work' }
      - name: Tray self-test (GUI smoke test on Windows runner)
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          $exe = 'apps/pc-agent/publish/Tray/SafePC.Agent.Tray.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw 'Tray self-test timed out after 120s' }
          if ($proc.ExitCode -ne 0) { throw "Tray self-test FAILED (exit $($proc.ExitCode)) - see tray log in the next step" }
          Write-Host 'Tray self-test PASSED'
      - name: Show tray self-test log
        if: always() && steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          $logDir = Join-Path $env:LOCALAPPDATA 'SafePC\logs'
          if (Test-Path $logDir) { Get-ChildItem $logDir -Filter *.log | ForEach-Object { Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 150 } } else { Write-Host 'No tray log dir found' }
      - name: Service IPC self-test (lock/unlock delivery)
        # if: always(): cổng Service phải chạy và báo cáo độc lập ngay cả khi
        # cổng Tray rớt (run #127: bước này bị bỏ qua nên không có tín hiệu
        # nào từ phía Service). Job vẫn đỏ nếu bước Tray đã rớt; bước cài
        # đặt/upload bên dưới không có always() nên run đỏ không tạo artifact.
        if: always() && steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          $exe = 'apps/pc-agent/publish/Service/SafePC.Agent.Service.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test-ipc' -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(60000)) { $proc.Kill(); throw 'Service IPC self-test timed out after 60s' }
          if ($proc.ExitCode -ne 0) { throw "Service IPC self-test FAILED (exit $($proc.ExitCode)) - see service log in the next step" }
          Write-Host 'Service IPC self-test PASSED'
      - name: Show service self-test log
        if: always() && steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          $logDir = Join-Path $env:ProgramData 'SafePC\logs'
          if (Test-Path $logDir) { Get-ChildItem $logDir -Filter *.log | ForEach-Object { Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 80 } } else { Write-Host 'No service log dir found' }
      - name: Cache Inno Setup
        if: steps.check.outputs.exists == 'true'
        id: inno-cache
        uses: actions/cache@v5
        with:
          # ISCC.exe tu dung trong thu muc cai dat (khong can dang ky he
          # thong), nen khoi phuc cache la du; buoc build ben duoi goi ISCC
          # bang duong dan day du. Tang so trong key de ep cai ban Inno
          # Setup moi.
          path: 'C:/Program Files (x86)/Inno Setup 6'
          key: windows-innosetup-6-v1
      - name: Install Inno Setup
        if: steps.check.outputs.exists == 'true' && steps.inno-cache.outputs.cache-hit != 'true'
        run: choco install innosetup -y --no-progress
      - name: Build installer
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = 'ISCC.exe' }
          & $iscc /DAppVersion=0.1.${{ github.run_number }} apps/pc-agent/installer/SafePCAgent.iss
      - name: Upload installer artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: SafePCAgentSetup
          path: apps/pc-agent/installer-output/SafePCAgentSetup-*.exe
          if-no-files-found: error
          retention-days: 14
