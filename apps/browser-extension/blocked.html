<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafePC — Trang bị chặn</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 40px 16px;
      color: #1f2937;
      background: #f9fafb;
      text-align: center;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #4b5563;
      margin: 0 0 8px;
    }
    .brand {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 20px;
    }
    .request-button {
      min-height: 44px;
      padding: 10px 20px;
      margin-top: 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .request-button:disabled {
      background: #a5b4fc;
      cursor: default;
    }
    .request-status {
      font-size: 14px;
      line-height: 1.6;
      color: #065f46;
      margin-top: 12px;
    }
    .request-error {
      font-size: 14px;
      line-height: 1.6;
      color: #b91c1c;
      margin-top: 12px;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Trang này đã bị chặn</h1>
    <p id="reason">Trang web này đã bị chặn theo quy tắc của phụ huynh.</p>
    <p>Nếu con cần mở trang này, hãy hỏi phụ huynh nhé.</p>
    <div id="request-box" hidden>
      <button id="request-button" class="request-button" type="button">Xin phép mở trang này</button>
      <p id="request-status" class="request-status" hidden></p>
      <p id="request-error" class="request-error" hidden></p>
    </div>
    <p class="brand">SafePC — bảo vệ máy tính của con</p>
  </div>
  <script src="domainUtils.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
