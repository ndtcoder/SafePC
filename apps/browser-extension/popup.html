<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafePC</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      min-width: 260px;
      padding: 16px;
      color: #1f2937;
      background: #ffffff;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .status {
      font-size: 13px;
      margin: 0;
    }
    .status.ok {
      color: #047857;
    }
    .status.off {
      color: #b45309;
    }
    .section {
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      margin: 14px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 13px;
    }
    li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    li:last-child {
      border-bottom: none;
    }
    .domain {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .minutes {
      color: #6b7280;
      white-space: nowrap;
    }
    .empty {
      font-size: 13px;
      color: #6b7280;
      margin: 0;
    }
    .note {
      font-size: 12px;
      color: #9ca3af;
      margin: 14px 0 0;
    }
    .note.off {
      color: #b45309;
    }
    .note.dnr {
      margin-top: 6px;
    }
    .note.dnr-detail {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <p id="title" class="title">SafePC</p>
  <p id="status" class="status">Đang kiểm tra…</p>
  <p class="section">Thời gian hôm nay (trang bị giới hạn)</p>
  <ul id="limits"></ul>
  <p id="empty" class="empty" hidden>Không có trang nào bị giới hạn thời gian.</p>
  <p id="sync" class="note"></p>
  <p id="dnr-blocked" class="note dnr"></p>
  <p id="dnr-applied" class="note dnr" hidden></p>
  <p id="dnr-error" class="note dnr" hidden></p>
  <p id="dnr-domains" class="note dnr dnr-detail" hidden></p>
  <p id="dnr-rules" class="note dnr dnr-detail" hidden></p>
  <p class="note">Quy tắc do phụ huynh đặt trên Dashboard SafePC.</p>
  <script src="domainUtils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
